<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Система раскроя профиля</title>

<style>
:root{
  --bg:#0f1115;
  --card:#151922;
  --panel:#0c1020;
  --panel2:#0b0f1c;
  --text:#e7eaf0;
  --muted:#9aa3b2;
  --line:#2a3140;
  --accent:#b71c1c;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui;
  font-size:15px;
}

.container{max-width:1100px;margin:auto;padding:20px;}
.card{
  background:var(--card);
  border:1px solid var(--line);
  padding:20px;
}

.hidden{display:none;}

h1{margin:0;font-size:20px;}
label{display:block;margin-top:12px;font-weight:700;font-size:13px;}

input,button{
  height:38px;
  border:1px solid var(--line);
  background:#111827;
  color:white;
  padding:0 10px;
  font-size:14px;
}

button{
  cursor:pointer;
  font-weight:700;
}
button.primary{background:#1f2937;}
button.danger{background:var(--accent);border:none;}

.section{margin-top:20px;}
.list{margin-top:10px;display:flex;flex-direction:column;gap:10px;}

.row{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
  align-items:end;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
}

.stats{
  margin-top:20px;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel2);
}

.bars{margin-top:20px;display:flex;flex-direction:column;gap:15px;}

.bar{
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
}

.viz{
  display:flex;
  height:30px;
  border:1px solid var(--line);
  background:#0b0f1c;
}

.seg{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:13px;
  overflow:hidden;
  position:relative;
  white-space:nowrap;
}

.seg.cut{background:#3b82f6;}
.seg.rest{background:#6b7280;}
.seg.kerf{
  background:#111;
  min-width:8px;
}

.seg.kerf::after{
  content:"";
  position:absolute;
  top:2px;
  bottom:2px;
  left:50%;
  transform:translateX(-50%);
  border-left:1px dashed #000;
}

/* PRINT */
@media print{
  @page{size:A4;margin:10mm;}
  body{background:white;color:black;}
  .no-print{display:none;}
  .card{border:none;padding:0;}
  .viz{height:28px;border:1px solid #000;background:white;}
  .seg{font-size:12px;color:black;}
  .seg.cut{background:#d9d9d9;}
  .seg.rest{background:#f0f0f0;}
  .seg.kerf{background:white;}
  .seg.kerf::after{
    border-left:1px dashed #000;
  }
}
</style>
</head>

<body>
<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
<h1>Вход</h1>
<label>Логин</label>
<input id="login"/>
<label>Пароль</label>
<input id="password" type="password"/>
<button class="primary" style="width:100%;margin-top:12px;" onclick="login()">Войти</button>
<div id="msg" style="margin-top:10px;color:red;"></div>
</div>

<!-- APP -->
<div id="appBox" class="hidden">
<div class="card">

<h1>Раскрой профиля</h1>

<label>Название</label>
<input id="job"/>

<label>Ширина диска (мм)</label>
<input id="kerf" type="number" value="5"/>

<div class="section">
<h3>Профили</h3>
<div id="stocks" class="list"></div>
<button class="primary" onclick="addStock()">+ Профиль</button>
</div>

<div class="section">
<h3>Заготовки</h3>
<div id="parts" class="list"></div>
<button class="primary" onclick="addPart()">+ Заготовка</button>
</div>

<div style="margin-top:20px;">
<button class="primary" onclick="calculate()">Рассчитать</button>
<button onclick="window.print()">Печать / PDF</button>
</div>

<div id="stats" class="stats hidden"></div>
<div id="result" class="bars"></div>

</div>
</div>

</div>

<script>
const users={
  "masterclusterpro":"qwerty",
  "mastercluster":"qwerty"
};

function login(){
  const l=document.getElementById("login").value;
  const p=document.getElementById("password").value;
  if(users[l] && users[l]===p){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("appBox").classList.remove("hidden");
  }else{
    document.getElementById("msg").innerText="Неверный логин или пароль";
  }
}

function addStock(){
  const div=document.createElement("div");
  div.className="row";
  div.innerHTML=`
    <input class="sLen" placeholder="Длина">
    <input class="sQty" placeholder="Кол-во (пусто = ∞)">
    <button class="danger" onclick="this.parentElement.remove()">−</button>
  `;
  document.getElementById("stocks").appendChild(div);
}

function addPart(){
  const div=document.createElement("div");
  div.className="row";
  div.innerHTML=`
    <input class="pLen" placeholder="Длина">
    <input class="pQty" value="1">
    <button class="danger" onclick="this.parentElement.remove()">−</button>
  `;
  document.getElementById("parts").appendChild(div);
}

addStock();
addPart();

function calculate(){
  const kerf=Number(document.getElementById("kerf").value)||0;
  const stocks=[...document.querySelectorAll(".sLen")].map(i=>Number(i.value));
  const parts=[];
  document.querySelectorAll(".pLen").forEach((el,i)=>{
    const len=Number(el.value);
    const qty=Number(document.querySelectorAll(".pQty")[i].value);
    for(let j=0;j<qty;j++) parts.push(len);
  });

  if(!stocks.length||!parts.length) return;

  const stock=stocks[0];
  parts.sort((a,b)=>b-a);

  let sum=0;
  let count=0;
  const used=[];

  for(const p of parts){
    if(sum+p+(count?kerf:0)<=stock){
      sum+=p;
      if(count) sum+=kerf;
      used.push(p);
      count++;
    }
  }

  const rest=stock-sum;

  document.getElementById("stats").classList.remove("hidden");
  document.getElementById("stats").innerHTML=`
    <div class="stat"><b>Профиль</b><br>${stock}</div>
    <div class="stat"><b>Сумма деталей</b><br>${used.reduce((s,x)=>s+x,0)}</div>
    <div class="stat"><b>Остаток</b><br>${rest}</div>
  `;

  const viz=document.createElement("div");
  viz.className="viz";

  used.forEach((p,i)=>{
    const seg=document.createElement("div");
    seg.className="seg cut";
    seg.style.width=(p/stock*100)+"%";
    seg.innerText=p;
    viz.appendChild(seg);

    if(i<used.length-1){
      const k=document.createElement("div");
      k.className="seg kerf";
      k.style.width=(kerf/stock*100)+"%";
      viz.appendChild(k);
    }
  });

  const rs=document.createElement("div");
  rs.className="seg rest";
  rs.style.width=(rest/stock*100)+"%";
  rs.innerText=rest;
  viz.appendChild(rs);

  const bar=document.createElement("div");
  bar.className="bar";
  bar.appendChild(viz);

  const result=document.getElementById("result");
  result.innerHTML="";
  result.appendChild(bar);
}
</script>
</body>
</html>
