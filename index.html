<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Система раскроя профиля</title>

<style>
:root{
  --bg:#0f1115;
  --card:#151922;
  --panel:#0c1020;
  --panel2:#0b0f1c;
  --text:#e7eaf0;
  --muted:#9aa3b2;
  --line:#2a3140;
  --accent:#b71c1c;
  --ok:#22c55e;
  --bad:#ef4444;

  --fs:15px;
  --lh:20px;
  --h:40px;
  --gap:12px;
}

/* УБРАНЫ ВСЕ СКРУГЛЕНИЯ */
*{
  box-sizing:border-box;
  border-radius:0 !important;
}

body{
  margin:0;
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg);
  color:var(--text);
  font-size:var(--fs);
  line-height:var(--lh);
}

.container{
  max-width:1050px;
  margin:0 auto;
  padding:18px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  padding:18px;
  box-shadow:none;
}

.hidden{ display:none; }

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.logoBox{
  height:44px;
  display:flex;
  align-items:center;
}
.logoBox img{
  height:44px;
  width:auto;
}

.brand h1{
  margin:0;
  font-size:20px;
}
.brand .sub{
  font-size:13px;
  color:var(--muted);
}

label{
  display:block;
  margin:10px 0 6px;
  font-weight:700;
  font-size:13px;
}

.smallhint{
  font-size:12px;
  color:var(--muted);
}

input, button{
  height:var(--h);
  font-size:var(--fs);
  line-height:var(--lh);
}

input{
  width:100%;
  padding:0 12px;
  border:1px solid var(--line);
  background:#0e1220;
  color:var(--text);
}

button{
  padding:0 12px;
  border:1px solid var(--line);
  background:#1e2533;
  color:var(--text);
  font-weight:800;
  cursor:pointer;
}

button.primary{ background:#2b3447; }
button.ghost{ background:transparent; }
button.danger{ background:var(--accent); border:none; }

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--gap);
}
.grid1{
  display:grid;
  grid-template-columns:1fr;
  gap:var(--gap);
}

.inlineField{
  display:flex;
  align-items:center;
  gap:10px;
}

.inputTiny{ width:120px; }

/* ===== Списки ===== */

.sectionHead{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-top:16px;
}

.list{
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.rowWrap{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
}

.rowBox{
  border:1px solid var(--line);
  background:var(--panel);
  padding:12px;
}

.rowBoxGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.rowBtns{
  display:flex;
  flex-direction:column;
  gap:8px;
  justify-content:center;
}

.btnMini{
  width:52px;
  font-size:18px;
  font-weight:900;
}

/* ===== Статистика ===== */

.statsBox{
  margin-top:16px;
  border:1px solid var(--line);
  background:var(--panel);
  padding:12px;
}

.statsGrid{
  margin-top:10px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  border:1px solid var(--line);
  background:var(--panel2);
  padding:10px;
}

.stat .k{
  font-size:12px;
  color:var(--muted);
}
.stat .v{
  font-size:16px;
  font-weight:900;
  margin-top:4px;
}

/* ===== Визуализация ===== */

.bars{
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.barCard{
  border:1px solid var(--line);
  background:var(--panel);
  padding:12px;
}

.barTitle{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.barLine{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:10px;
}

.mult{
  border:1px solid var(--line);
  background:var(--panel2);
  padding:8px;
  text-align:center;
  font-weight:900;
  white-space:pre-line;
}

.viz{
  height:28px;
  border:1px solid var(--line);
  background:var(--panel2);
  overflow:hidden;
  display:flex;
}

.seg{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:11px;
  font-weight:900;
  padding:0 6px;
  white-space:nowrap;
}

.seg.cut{ background:#60a5fa; }
.seg.kerf{ background:#ff0000; min-width:8px; }
.seg.rest{ background:#9ca3af; color:#111; }

.seg .t{
  max-width:100%;
  overflow:hidden;
}

/* ===== Печать ===== */

@media print{
  @page{ size:A4; margin:10mm; }

  body{
    background:white;
    color:black;
  }

  .no-print{
    display:none !important;
  }

  .card{
    border:none;
    padding:0;
  }

  .viz{
    height:18px;
  }

  .seg{
    font-size:8px;
    color:black !important;
  }
}
</style>
</head>

<body>
<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <div class="brand">
    <div class="logoBox"><img src="logo.png" alt="Logo"></div>
    <div>
      <h1>CLUSTER X</h1>
      <div class="sub">Вход в систему раскроя профиля</div>
    </div>
  </div>

  <label>Логин</label>
  <input id="login" type="text">

  <label>Пароль</label>
  <input id="password" type="password">

  <button class="primary" onclick="doLogin()">Войти</button>
  <div id="loginMsg"></div>
</div>

<!-- APP -->
<div id="appBox" class="hidden">
<div class="card">

<div class="topbar no-print">
  <div class="brand">
    <div class="logoBox"><img src="logo.png" alt="Logo"></div>
    <div>
      <h1>Раскрой алюминиевого профиля</h1>
      <div class="sub" id="jobSub">—</div>
    </div>
  </div>
  <button class="danger" onclick="logout()">Выйти</button>
</div>

<!-- Остальной JS и логика остаются без изменений -->
