<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Система раскроя профиля</title>

<style>

:root{
--bg:#0f1115;
--card:#151922;
--panel:#0c1020;
--text:#e7eaf0;
--muted:#9aa3b2;
--line:#2a3140;
--accent:#b71c1c;
}

*{
box-sizing:border-box;
border-radius:0!important;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
font-size:14px;
}

.container{
max-width:1100px;
margin:auto;
padding:18px;
}

.card{
background:var(--card);
border:1px solid var(--line);
padding:18px;
}

.hidden{
display:none;
}

.header{
display:flex;
gap:12px;
align-items:center;
margin-bottom:14px;
}

.logoBox img{
height:44px;
}

h1{
margin:0;
font-size:18px;
}

.sub{
font-size:12px;
color:var(--muted);
font-weight:800;
margin-top:4px;
}

label{
display:block;
margin-top:10px;
margin-bottom:6px;
font-size:12px;
font-weight:900;
}

input,button{
height:32px;
border:1px solid var(--line);
background:#111827;
color:white;
padding:0 8px;
font-size:13px;
}

button{
font-weight:900;
cursor:pointer;
background:#263244;
}

button.danger{
background:var(--accent);
border:none;
}

.section{
margin-top:16px;
}

.row{
display:flex;
gap:8px;
border:1px solid var(--line);
background:var(--panel);
padding:8px;
align-items:center;
}

.list{
display:flex;
flex-direction:column;
gap:8px;
}

.inpLen{
min-width:86px;
max-width:320px;
}

.inpQty{
min-width:86px;
max-width:320px;
text-align:center;
}

.btnDel{
width:36px;
}

.stats{
margin-top:16px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.stat{
border:1px solid var(--line);
background:var(--panel);
padding:10px;
}

.stat .k{
font-size:12px;
color:var(--muted);
font-weight:900;
}

.stat .v{
font-size:16px;
font-weight:900;
margin-top:4px;
}

.bars{
margin-top:16px;
display:flex;
flex-direction:column;
gap:12px;
}

.bar{
display:grid;
grid-template-columns:100px 1fr 150px;
gap:10px;
border:1px solid var(--line);
padding:10px;
background:var(--panel);
align-items:center;
}

.mult{
text-align:center;
font-weight:900;
border:1px solid var(--line);
padding:8px;
}

.tailBox{
border:1px solid var(--line);
padding:8px;
text-align:center;
}

.viz{
display:flex;
height:28px;
border:1px solid var(--line);
overflow:hidden;
}

.seg{
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
font-size:12px;
padding:0 6px;
white-space:nowrap;
}

.cut{
background:#3b82f6;
}

.rest{
background:#9ca3af;
color:black;
}

.sep{
width:0;
position:relative;
}

.sep::after{
content:"";
position:absolute;
top:3px;
bottom:3px;
left:-1px;
border-left:1px dashed white;
}

.tailLabel{
position:absolute;
right:4px;
top:50%;
transform:translateY(-50%);
font-size:12px;
font-weight:900;
padding:2px 6px;
background:#bfbfbf;
color:black;
border:1px solid var(--line);
}

</style>
</head>

<body>

<div class="container">

<div id="loginBox" class="card">

<div class="header">
<div class="logoBox">
<img src="logo.png">
</div>
<div>
<h1>Вход в систему</h1>
<div class="sub">Раскрой профиля</div>
</div>
</div>

<label>Логин</label>
<input id="login">

<label>Пароль</label>
<input id="password" type="password">

<button onclick="login()">Войти</button>

<div id="loginMsg"></div>

</div>

<div id="appBox" class="hidden">

<div class="card">

<div class="header">
<div class="logoBox">
<img src="logo.png">
</div>

<div>
<h1>Раскрой профиля</h1>
<div class="sub" id="jobTitle">—</div>
</div>
</div>

<label>Название / что режем</label>
<input id="jobInput">

<div class="section">

<h3>Профиль</h3>

<div id="stocksList" class="list"></div>

<button onclick="addStock()">+ Профиль</button>

</div>

<div class="section">

<h3>Заготовка</h3>

<div id="partsList" class="list"></div>

<button onclick="addPart()">+ Заготовка</button>

</div>

<div class="section">

<button onclick="calculate()">Рассчитать</button>
<button onclick="print()">Печать</button>

</div>

<div id="stats" class="stats"></div>

<div id="result" class="bars"></div>

</div>

</div>

</div>

<script>

const users={
"masterclusterpro":"qwerty"
}

function login(){

const l=document.getElementById("login").value
const p=document.getElementById("password").value

if(users[l]&&users[l]===p){

document.getElementById("loginBox").classList.add("hidden")
document.getElementById("appBox").classList.remove("hidden")

}

}

const measurer=document.createElement("span")
measurer.style.position="absolute"
measurer.style.visibility="hidden"
document.body.appendChild(measurer)

function autoSize(inp){

measurer.style.font=getComputedStyle(inp).font

let text=inp.value

const digits=text.replace(/\D/g,"")

if(digits.length<4)text="0000"

measurer.textContent=text

const w=measurer.getBoundingClientRect().width+20

inp.style.width=w+"px"

}

function attach(inp){

inp.addEventListener("input",()=>autoSize(inp))

autoSize(inp)

}

function addStock(){

const row=document.createElement("div")

row.className="row"

row.innerHTML=`
<input class="inpLen">
<input class="inpQty">
<button class="btnDel">−</button>
`

row.querySelector("button").onclick=()=>row.remove()

stocksList.appendChild(row)

attach(row.children[0])
attach(row.children[1])

}

function addPart(){

const row=document.createElement("div")

row.className="row"

row.innerHTML=`
<input class="inpLen">
<input class="inpQty" value="1">
<button class="btnDel">−</button>
`

row.querySelector("button").onclick=()=>row.remove()

partsList.appendChild(row)

attach(row.children[0])
attach(row.children[1])

}

addStock()
addPart()

function calculate(){

const parts=[...document.querySelectorAll("#partsList .row")]

let total=0

parts.forEach(r=>{
const len=Number(r.children[0].value)
const qty=Number(r.children[1].value)

total+=len*qty
})

stats.innerHTML=`
<div class="stat">
<div class="k">Сумма деталей</div>
<div class="v">${total}</div>
</div>
`

}

</script>

</body>
</html>
