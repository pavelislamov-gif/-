<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Система раскроя профиля</title>

<style>
:root{
  --bg:#0f1115;
  --card:#151922;
  --panel:#0c1020;
  --panel2:#0b0f1c;
  --text:#e7eaf0;
  --muted:#9aa3b2;
  --line:#2a3140;
  --accent:#b71c1c;
  --bad:#ff6666;

  --h:30px;
}

*{ box-sizing:border-box; border-radius:0 !important; }

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  font-size:14px;
}

.container{ max-width:1200px; margin:auto; padding:18px; }
.card{ background:var(--card); border:1px solid var(--line); padding:18px; }

.hidden{ display:none; }

.header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.logoBox img{ height:44px; }

h1{ margin:0; font-size:18px; }
h3{ margin:0 0 6px; }

label{
  display:block;
  margin-top:10px;
  font-weight:900;
  font-size:12px;
}

input,button{
  height:var(--h);
  border:1px solid var(--line);
  background:#111827;
  color:white;
  padding:0 8px;
  font-size:13px;
}

button{ cursor:pointer; font-weight:900; }
button.primary{ background:#1f2937; }
button.danger{ background:var(--accent); border:none; }

.section{ margin-top:14px; }
.list{ margin-top:8px; display:flex; flex-direction:column; gap:8px; }

.row{
  display:flex;
  gap:8px;
  align-items:center;
  border:1px solid var(--line);
  padding:8px;
  background:var(--panel);
  flex-wrap:wrap;
}

/* === длина (минимум 4 цифры) === */
.inpLen{
  min-width:86px;       /* под 4 цифры */
  max-width:320px;
}

/* количество компактное */
.inpQty{
  min-width:44px;
  max-width:90px;
  text-align:center;
}

.btnDel{
  width:34px;
  text-align:center;
  font-size:16px;
}

.err{
  margin-top:10px;
  padding:10px;
  border:1px solid var(--accent);
  color:var(--bad);
  background:rgba(183,28,28,.12);
  font-weight:900;
}

.stats{
  margin-top:16px;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel2);
}
.stat b{ display:block; font-size:12px; color:var(--muted); }
.stat .v{ font-size:16px; font-weight:900; }

.bars{ margin-top:16px; display:flex; flex-direction:column; gap:12px; }

.bar{
  display:grid;
  grid-template-columns:110px 1fr 180px;
  gap:10px;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
  align-items:center;
}

.mult{
  border:1px solid var(--line);
  padding:8px;
  text-align:center;
  font-weight:900;
  background:var(--panel2);
}

.tailBox{
  border:1px solid var(--line);
  padding:8px;
  background:var(--panel2);
  text-align:center;
  font-weight:900;
}

.viz{
  position:relative;
  display:flex;
  height:28px;
  border:1px solid var(--line);
  background:var(--panel2);
  overflow:hidden;
}

.seg{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:13px;
  overflow:hidden;
  padding:0 6px;
}

.seg.cut{ background:#3b82f6; }
.seg.rest{ background:#9ca3af; color:#111; }

.seg.kerf{
  background:#111;
  min-width:8px;
}
.seg.kerf::after{
  content:"";
  position:absolute;
  top:2px;
  bottom:2px;
  left:50%;
  transform:translateX(-50%);
  border-left:1px dashed #fff;
}

.tailLabel{
  position:absolute;
  right:4px;
  top:50%;
  transform:translateY(-50%);
  font-weight:900;
  font-size:12px;
  padding:4px 8px;
  border:1px solid var(--line);
  background:#bfbfbf;
  color:#000;
}

@media print{
  body{ background:white; color:black; }
  .no-print{ display:none !important; }
}
</style>
</head>

<body>
<div class="container">

<div class="card">

<div class="header">
  <div class="logoBox"><img src="logo.png"></div>
  <div>
    <h1>Раскрой профиля</h1>
  </div>
</div>

<div class="section">
  <label>Ширина диска (мм)</label>
  <input id="kerfInput" type="number" value="5">
</div>

<div class="section">
  <label>Порог делового хвоста (мм)</label>
  <input id="goodTailMin" type="number" value="200">
</div>

<div class="section">
  <h3>Профиль</h3>
  <div id="stocksList" class="list"></div>
  <button class="primary" id="addStockBtn">+ Профиль</button>
</div>

<div class="section">
  <h3>Заготовка</h3>
  <div id="partsList" class="list"></div>
  <button class="primary" id="addPartBtn">+ Заготовка</button>
</div>

<div class="section">
  <button class="primary" id="calcBtn">Рассчитать</button>
</div>

<div id="appErr" class="err hidden"></div>
<div id="stats" class="stats hidden"></div>
<div id="result" class="bars"></div>

</div>
</div>

<script>

/* ===== авторасширение ===== */

const measurer = document.createElement("span");
measurer.style.position = "absolute";
measurer.style.visibility = "hidden";
measurer.style.whiteSpace = "pre";
document.body.appendChild(measurer);

function autoSizeInput(inp){
  const cs = window.getComputedStyle(inp);
  measurer.style.font = cs.font;

  let text = inp.value || "";

  if(inp.classList.contains("inpLen")){
    const digits = text.replace(/\D/g,"");
    if(digits.length < 4){
      text = "0000";  // минимум под 4 цифры
    }
  }

  measurer.textContent = text;
  const w = measurer.getBoundingClientRect().width + 24;

  const min = inp.classList.contains("inpLen") ? 86 : 44;
  inp.style.width = Math.max(min, w) + "px";
}

function attachAuto(inp){
  inp.addEventListener("input", ()=>autoSizeInput(inp));
  autoSizeInput(inp);
}

/* ===== строки ===== */

function addStockRow(val="3050"){
  const r = document.createElement("div");
  r.className="row";
  r.innerHTML=`
    <input class="inpLen" type="number" value="${val}">
    <input class="inpQty" type="number" placeholder="∞">
    <button class="danger btnDel">−</button>
  `;
  r.querySelector(".btnDel").onclick=()=>r.remove();
  document.getElementById("stocksList").appendChild(r);

  attachAuto(r.querySelector(".inpLen"));
  attachAuto(r.querySelector(".inpQty"));
}

function addPartRow(val="",qty="1"){
  const r = document.createElement("div");
  r.className="row";
  r.innerHTML=`
    <input class="inpLen" type="number" value="${val}">
    <input class="inpQty" type="number" value="${qty}">
    <button class="danger btnDel">−</button>
  `;
  r.querySelector(".btnDel").onclick=()=>r.remove();
  document.getElementById("partsList").appendChild(r);

  attachAuto(r.querySelector(".inpLen"));
  attachAuto(r.querySelector(".inpQty"));
}

document.getElementById("addStockBtn").onclick=()=>addStockRow("");
document.getElementById("addPartBtn").onclick=()=>addPartRow("","1");

addStockRow("3050");
addPartRow("","1");

</script>
</body>
</html>
