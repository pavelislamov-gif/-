<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Система раскроя профиля</title>

<style>
:root{
  --bg:#0f1115;
  --card:#151922;
  --panel:#0c1020;
  --panel2:#0b0f1c;
  --text:#e7eaf0;
  --line:#2a3140;
  --accent:#b71c1c;
  --bad:#ff6666;
}

*{ box-sizing:border-box; border-radius:0 !important; }

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  font-size:15px;
}

.container{ max-width:1200px; margin:auto; padding:20px; }
.card{ background:var(--card); border:1px solid var(--line); padding:20px; }
.hidden{ display:none; }

.header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
}
.logoBox{ height:48px; display:flex; align-items:center; }
.logoBox img{ height:48px; }

h1{ margin:0; font-size:20px; }
h3{ margin:0 0 8px; font-size:16px; }

label{ display:block; margin-top:12px; font-weight:800; font-size:13px; }

input,button{
  height:36px;
  border:1px solid var(--line);
  background:#111827;
  color:white;
  padding:0 10px;
  font-size:14px;
}

button{ cursor:pointer; font-weight:900; }
button.primary{ background:#1f2937; }
button.danger{ background:var(--accent); border:none; }

.section{ margin-top:18px; }
.list{ margin-top:10px; display:flex; flex-direction:column; gap:10px; }

/* ===== строки ===== */
.row{
  display:grid;
  grid-template-columns:1fr 80px auto;
  gap:10px;
  align-items:end;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
}

/* узкое поле количества */
.inputQty{
  width:80px;
  text-align:center;
}

.err{
  margin-top:12px;
  padding:10px;
  border:1px solid var(--accent);
  color:var(--bad);
  background:rgba(183,28,28,.12);
  font-weight:900;
}

.stats{
  margin-top:20px;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel2);
}

.bars{ margin-top:20px; display:flex; flex-direction:column; gap:15px; }

.bar{
  display:grid;
  grid-template-columns:120px 1fr 140px;
  gap:12px;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
  align-items:center;
}

.mult{
  border:1px solid var(--line);
  padding:10px;
  text-align:center;
  font-weight:900;
  background:var(--panel2);
}

.tailBox{
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel2);
  text-align:center;
  font-weight:900;
}

.tailBox .k{ font-size:12px; color:#9aa3b2; }
.tailBox .v{ font-size:16px; margin-top:4px; }

.viz{
  position:relative;
  display:flex;
  height:30px;
  border:1px solid var(--line);
  background:var(--panel2);
  overflow:hidden;
}

.seg{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:13px;
  overflow:hidden;
  min-width:0;
  white-space:nowrap;
  padding:0 6px;
  position:relative;
  color:#0b0f1c;
}

.seg.cut{ background:#3b82f6; }
.seg.rest{ background:#9ca3af; color:#111; }

.seg.kerf{
  background:#111;
  min-width:8px;
}

.seg.kerf::after{
  content:"";
  position:absolute;
  top:2px;
  bottom:2px;
  left:50%;
  transform:translateX(-50%);
  border-left:1px dashed #fff;
}

.tailLabel{
  position:absolute;
  right:4px;
  top:50%;
  transform:translateY(-50%);
  font-weight:900;
  font-size:12px;
  padding:3px 6px;
  border:1px solid var(--line);
  background:#bfbfbf;
  color:#000;
}

@media print{
  body{ background:white; color:black; }
  .no-print{ display:none !important; }
  .card{ border:none; padding:0; }
  .seg.cut{ background:#d9d9d9 !important; }
  .seg.rest{ background:#bfbfbf !important; }
  .seg.kerf::after{ border-left:1px dashed #000; }
}
</style>
</head>

<body>
<div class="container">

<div id="loginBox" class="card">
  <div class="header">
    <div class="logoBox"><img src="logo.png"></div>
    <h1>Вход</h1>
  </div>

  <label>Логин</label>
  <input id="loginInput">

  <label>Пароль</label>
  <input id="passwordInput" type="password">

  <div style="margin-top:10px;">
    <button class="primary" onclick="login()">Войти</button>
  </div>
  <div id="loginErr" class="err hidden"></div>
</div>

<div id="appBox" class="hidden">
<div class="card">

<div class="header">
  <div class="logoBox"><img src="logo.png"></div>
  <h1>Раскрой профиля</h1>
</div>

<label>Ширина диска (мм)</label>
<input id="kerfInput" type="number" value="5">

<div class="section">
<h3>Профиль</h3>
<div id="stocksList" class="list"></div>
<button class="primary" onclick="addStock()">+ Профиль</button>
</div>

<div class="section">
<h3>Заготовки</h3>
<div id="partsList" class="list"></div>
<button class="primary" onclick="addPart()">+ Заготовка</button>
</div>

<div class="section no-print" style="display:flex;gap:10px;">
<button class="primary" onclick="calculate()">Рассчитать</button>
<button class="primary" onclick="window.print()">Печать / PDF</button>
<button class="danger" onclick="logout()">Выйти</button>
</div>

<div id="errorBox" class="err hidden"></div>
<div id="stats" class="stats hidden"></div>
<div id="result" class="bars"></div>

</div>
</div>
</div>

<script>
const USERS = {"masterclusterpro":"qwerty"};

function login(){
  const l=document.getElementById("loginInput").value.trim();
  const p=document.getElementById("passwordInput").value;
  if(USERS[l]===p){
    localStorage.setItem("auth","1");
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("appBox").classList.remove("hidden");
  }else{
    const e=document.getElementById("loginErr");
    e.textContent="Неверный логин";
    e.classList.remove("hidden");
  }
}

function logout(){ localStorage.removeItem("auth"); location.reload(); }

function addStock(){
  const r=document.createElement("div");
  r.className="row";
  r.innerHTML=`
  <input class="sLen" type="number" value="3050">
  <input class="inputQty" type="number" placeholder="∞">
  <button class="danger" onclick="this.parentNode.remove()">−</button>`;
  document.getElementById("stocksList").appendChild(r);
}

function addPart(){
  const r=document.createElement("div");
  r.className="row";
  r.innerHTML=`
  <input class="pLen" type="number">
  <input class="inputQty pQty" type="number" value="1">
  <button class="danger" onclick="this.parentNode.remove()">−</button>`;
  document.getElementById("partsList").appendChild(r);
}

function sum(a){return a.reduce((s,x)=>s+x,0);}

function calculate(){
  const kerf=Number(document.getElementById("kerfInput").value);
  const stock=Number(document.querySelector(".sLen").value);
  const parts=[];
  document.querySelectorAll(".pLen").forEach((e,i)=>{
    const len=Number(e.value);
    const qty=Number(document.querySelectorAll(".pQty")[i].value);
    for(let k=0;k<qty;k++) parts.push(len);
  });

  const bars=[];
  parts.sort((a,b)=>b-a);
  parts.forEach(p=>{
    let placed=false;
    for(const b of bars){
      const used=sum(b)+b.length*kerf;
      if(used+p+kerf<=stock){ b.push(p); placed=true; break;}
    }
    if(!placed) bars.push([p]);
  });

  const stats=document.getElementById("stats");
  stats.classList.remove("hidden");
  stats.innerHTML=`<div class="stat"><b>Палок</b>${bars.length}</div>`;

  const result=document.getElementById("result");
  result.innerHTML="";

  bars.forEach(b=>{
    const bar=document.createElement("div");
    bar.className="bar";

    const mult=document.createElement("div");
    mult.className="mult";
    mult.innerHTML=`1×<br>${stock}`;

    const viz=document.createElement("div");
    viz.className="viz";

    b.forEach(p=>{
      const seg=document.createElement("div");
      seg.className="seg cut";
      seg.style.width=(p/stock*100)+"%";
      seg.innerHTML=p;
      viz.appendChild(seg);

      const k=document.createElement("div");
      k.className="seg kerf";
      viz.appendChild(k);
    });

    const used=sum(b)+b.length*kerf;
    const rest=stock-used;

    if(rest>0){
      const r=document.createElement("div");
      r.className="seg rest";
      r.style.width=(rest/stock*100)+"%";
      r.innerHTML=rest;
      viz.appendChild(r);

      const label=document.createElement("div");
      label.className="tailLabel";
      label.textContent=rest;
      viz.appendChild(label);
    }

    const tail=document.createElement("div");
    tail.className="tailBox";
    tail.innerHTML=`<div class="k">Остаток</div><div class="v">${rest}</div>`;

    bar.appendChild(mult);
    bar.appendChild(viz);
    bar.appendChild(tail);
    result.appendChild(bar);
  });
}

addStock();
addPart();

if(localStorage.getItem("auth")){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("appBox").classList.remove("hidden");
}
</script>
</body>
</html>
