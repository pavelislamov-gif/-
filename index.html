<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Система раскроя профиля</title>

<style>
:root{
  --bg:#0f1115;
  --card:#151922;
  --panel:#0c1020;
  --panel2:#0b0f1c;
  --text:#e7eaf0;
  --line:#2a3140;
  --accent:#b71c1c;
  --bad:#ff6666;
}

*{ box-sizing:border-box; border-radius:0 !important; }

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  font-size:15px;
}

.container{ max-width:1200px; margin:auto; padding:20px; }
.card{ background:var(--card); border:1px solid var(--line); padding:20px; }
.hidden{ display:none; }

.header{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.logoBox{
  height:50px;
  display:flex;
  align-items:center;
}
.logoBox img{
  height:50px;
  width:auto;
  display:block;
}

h1{ margin:0; font-size:20px; }

label{ display:block; margin-top:12px; font-weight:700; font-size:13px; }

input,button{
  height:36px;
  border:1px solid var(--line);
  background:#111827;
  color:white;
  padding:0 10px;
}
button{ cursor:pointer; font-weight:800; }
button.primary{ background:#1f2937; }
button.danger{ background:var(--accent); border:none; }

.section{ margin-top:18px; }
.list{ margin-top:10px; display:flex; flex-direction:column; gap:10px; }

.row{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
  align-items:end;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
}

.err{
  margin-top:12px;
  padding:10px;
  border:1px solid var(--accent);
  color:var(--bad);
  background:rgba(183,28,28,.12);
  font-weight:800;
}

.stats{
  margin-top:20px;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel2);
}

.bars{ margin-top:20px; display:flex; flex-direction:column; gap:15px; }

.bar{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:15px;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
}

.mult{
  border:1px solid var(--line);
  padding:10px;
  text-align:center;
  font-weight:900;
  background:var(--panel2);
}

.viz{
  display:flex;
  height:30px;
  border:1px solid var(--line);
  background:var(--panel2);
  overflow:hidden;
}

.seg{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:13px;
  overflow:hidden;
  min-width:0;
  white-space:nowrap;
  padding:0 6px;
  position:relative;
}

.seg span{
  display:block;
  max-width:100%;
  overflow:hidden;
}

.seg.cut{ background:#3b82f6; color:#000; }
.seg.rest{ background:#9ca3af; color:#000; }

.seg.kerf{
  background:#111;
  min-width:8px;
}

.seg.kerf::after{
  content:"";
  position:absolute;
  top:2px;
  bottom:2px;
  left:50%;
  transform:translateX(-50%);
  border-left:1px dashed #fff;
}

/* ===== PRINT ===== */
@media print{
  @page{ size:A4; margin:10mm; }

  body{ background:white; color:black; }

  .no-print{ display:none !important; }

  .card{ border:none; padding:0; }

  .logoBox img{ height:35px; }

  .stats{ border:1px solid #000; background:#fff; }
  .stat{ border:1px solid #000; background:#fff; color:#000; }

  .bar{ border:1px solid #000; background:#fff; page-break-inside:avoid; }
  .mult{ border:1px solid #000; background:#fff; color:#000; }

  .viz{ border:1px solid #000; background:#fff; height:28px; }

  .seg{ color:#000 !important; font-size:12px; }
  .seg.cut{ background:#d9d9d9 !important; }
  .seg.rest{ background:#bfbfbf !important; }
  .seg.kerf{ background:#fff !important; min-width:10px; }
  .seg.kerf::after{ border-left:1px dashed #000; }
}
</style>
</head>

<body>
<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <div class="header">
    <div class="logoBox">
      <img src="logo.png" alt="Logo">
    </div>
    <h1>Вход в систему</h1>
  </div>

  <label>Логин</label>
  <input id="login" placeholder="masterclusterpro">

  <label>Пароль</label>
  <input id="password" type="password" placeholder="qwerty">

  <div class="section">
    <button class="primary" onclick="doLogin()">Войти</button>
  </div>

  <div id="msg" class="err hidden"></div>
</div>

<!-- APP -->
<div id="appBox" class="hidden">
<div class="card">

  <div class="header">
    <div class="logoBox">
      <img src="logo.png" alt="Logo">
    </div>
    <h1>Раскрой профиля</h1>
  </div>

  <div class="no-print">
    <label>Название</label>
    <input id="job">

    <label>Ширина диска (мм)</label>
    <input id="kerf" type="number" value="5">
  </div>

  <div class="section no-print">
    <h3>Профили</h3>
    <div id="stocks" class="list"></div>
    <button class="primary" onclick="addStock()">+ Профиль</button>
  </div>

  <div class="section no-print">
    <h3>Заготовки</h3>
    <div id="parts" class="list"></div>
    <button class="primary" onclick="addPart()">+ Заготовка</button>
  </div>

  <div class="section no-print" style="display:flex; gap:10px;">
    <button class="primary" onclick="calculate()">Рассчитать</button>
    <button class="primary" onclick="window.print()">Печать / PDF</button>
    <button class="danger" onclick="logout()">Выйти</button>
  </div>

  <div id="appErr" class="err hidden"></div>
  <div id="stats" class="stats hidden"></div>
  <div id="result" class="bars"></div>

</div>
</div>

</div>

<script>
const users={
  "masterclusterpro":"qwerty",
  "mastercluster":"qwerty"
};

function doLogin(){
  if(users[login.value.trim()]===password.value){
    localStorage.setItem("auth","1");
    loginBox.classList.add("hidden");
    appBox.classList.remove("hidden");
  }else{
    msg.textContent="Неверный логин или пароль";
    msg.classList.remove("hidden");
  }
}
function logout(){ localStorage.removeItem("auth"); location.reload(); }
if(localStorage.getItem("auth")){
  loginBox.classList.add("hidden");
  appBox.classList.remove("hidden");
}

function addStock(val="3050"){
  stocks.insertAdjacentHTML("beforeend",
    `<div class="row">
      <input class="sLen" value="${val}">
      <div></div>
      <button onclick="this.parentElement.remove();calculate()">−</button>
    </div>`);
}

function addPart(val="",qty="1"){
  parts.insertAdjacentHTML("beforeend",
    `<div class="row">
      <input class="pLen" value="${val}">
      <input class="pQty" value="${qty}">
      <button onclick="this.parentElement.remove();calculate()">−</button>
    </div>`);
}

addStock();
addPart();

function calculate(){
  appErr.classList.add("hidden");
  stats.classList.add("hidden");
  result.innerHTML="";

  const stock=parseInt(document.querySelector(".sLen").value);
  const kerf=parseFloat(kerf.value)||0;
  if(!stock){ appErr.textContent="Введите длину профиля"; appErr.classList.remove("hidden"); return; }

  let partsList=[];
  document.querySelectorAll(".pLen").forEach((el,i)=>{
    const len=parseInt(el.value);
    const qty=parseInt(document.querySelectorAll(".pQty")[i].value)||1;
    if(len) for(let j=0;j<qty;j++) partsList.push(len);
  });
  if(partsList.length===0){ appErr.textContent="Добавьте заготовки"; appErr.classList.remove("hidden"); return; }

  partsList.sort((a,b)=>b-a);

  const bars=[];
  for(const piece of partsList){
    let placed=false;
    for(const bar of bars){
      const addKerf=bar.parts.length?kerf:0;
      if(bar.sum+addKerf+piece<=stock){
        bar.parts.push(piece);
        bar.sum+=addKerf+piece;
        placed=true;
        break;
      }
    }
    if(!placed) bars.push({parts:[piece],sum:piece});
  }

  stats.classList.remove("hidden");
  stats.innerHTML=`<div class="stat"><b>Палок</b><br>${bars.length}</div>
                   <div class="stat"><b>Профиль</b><br>${stock}</div>
                   <div class="stat"><b>Деталей</b><br>${partsList.length}</div>`;

  bars.forEach(bar=>{
    const div=document.createElement("div");
    div.className="bar";
    const mult=document.createElement("div");
    mult.className="mult";
    mult.innerHTML=`1×<br>${stock}`;
    const viz=document.createElement("div");
    viz.className="viz";
    let sum=0;

    bar.parts.forEach((p,i)=>{
      viz.innerHTML+=`<div class="seg cut" style="width:${p/stock*100}%"><span>${p}</span></div>`;
      if(i<bar.parts.length-1)
        viz.innerHTML+=`<div class="seg kerf" style="width:${Math.max(kerf/stock*100,0.8)}%"></div>`;
      sum+=p+(i?kerf:0);
    });

    const rest=stock-sum;
    if(rest>0){
      viz.innerHTML+=`<div class="seg kerf" style="width:0.8%"></div>`;
      viz.innerHTML+=`<div class="seg rest" style="width:${rest/stock*100}%"><span>${rest}</span></div>`;
    }

    div.appendChild(mult);
    div.appendChild(viz);
    result.appendChild(div);
  });
}
</script>
</body>
</html>
