<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Система раскроя профиля</title>

<style>
:root{
 --bg:#0f1115;
 --card:#151922;
 --panel:#0c1020;
 --panel2:#0b0f1c;
 --text:#e7eaf0;
 --muted:#9aa3b2;
 --line:#2a3140;
 --accent:#b71c1c;
 --bad:#ff6666;
}

*{ box-sizing:border-box; border-radius:0 !important; }

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
 font-size:15px;
}

.container{ max-width:1200px; margin:auto; padding:20px; }
.card{ background:var(--card); border:1px solid var(--line); padding:20px; }
.hidden{ display:none; }

.header{
 display:flex;
 align-items:center;
 gap:14px;
 margin-bottom:16px;
}
.logoBox{ height:48px; display:flex; align-items:center; }
.logoBox img{ height:48px; width:auto; display:block; }

.headText{ min-width:0; }
h1{ margin:0; font-size:20px; }
.subTitle{
 margin-top:4px;
 font-size:13px;
 color:var(--muted);
 font-weight:800;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
h3{ margin:0 0 8px; font-size:16px; }

label{ display:block; margin-top:12px; font-weight:900; font-size:13px; }

input,button{
 height:36px;
 border:1px solid var(--line);
 background:#111827;
 color:white;
 padding:0 10px;
 font-size:14px;
}
button{ cursor:pointer; font-weight:900; }
button.primary{ background:#1f2937; }
button.danger{ background:var(--accent); border:none; }

.section{ margin-top:18px; }
.list{ margin-top:10px; display:flex; flex-direction:column; gap:10px; }

/* строки: длина | кол-во (узкое) | кнопка */
.row{
 display:grid;
 grid-template-columns:1fr 80px auto;
 gap:10px;
 align-items:end;
 border:1px solid var(--line);
 padding:10px;
 background:var(--panel);
}
.inputQty{ width:80px; text-align:center; }

.err{
 margin-top:12px;
 padding:10px;
 border:1px solid var(--accent);
 color:var(--bad);
 background:rgba(183,28,28,.12);
 font-weight:900;
}

/* статистика */
.stats{
 margin-top:20px;
 border:1px solid var(--line);
 padding:10px;
 background:var(--panel);
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}
.stat{
 border:1px solid var(--line);
 padding:10px;
 background:var(--panel2);
}
.stat b{ display:block; margin-bottom:4px; font-size:12px; color:var(--muted); }
.stat .v{ font-size:16px; font-weight:900; }

/* результат */
.bars{ margin-top:20px; display:flex; flex-direction:column; gap:15px; }

.bar{
 display:grid;
 grid-template-columns:120px 1fr 190px;
 gap:12px;
 border:1px solid var(--line);
 padding:10px;
 background:var(--panel);
 align-items:center;
}

.mult{
 border:1px solid var(--line);
 padding:10px;
 text-align:center;
 font-weight:900;
 background:var(--panel2);
 line-height:1.15;
}

.tailBox{
 border:1px solid var(--line);
 padding:10px;
 background:var(--panel2);
 text-align:center;
 font-weight:900;
 line-height:1.15;
}
.tailBox .k{ font-size:12px; color:var(--muted); font-weight:900; }
.tailBox .v{ font-size:16px; margin-top:4px; color:var(--text); }
.tailBox .v2{ font-size:13px; margin-top:6px; color:var(--text); font-weight:900; }
.badge{
 display:inline-block;
 margin-top:8px;
 padding:4px 8px;
 border:1px solid var(--line);
 font-size:12px;
 font-weight:900;
}

/* визуализация */
.viz{
 position:relative;
 display:flex;
 height:30px;
 border:1px solid var(--line);
 background:var(--panel2);
 overflow:hidden;
}

.seg{
 height:100%;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:900;
 font-size:13px;
 overflow:hidden;
 min-width:0;
 white-space:nowrap;
 padding:0 6px;
 position:relative;
 color:#0b0f1c;
}

.seg.cut{ background:#3b82f6; }
.seg.rest{ background:#9ca3af; color:#111; }

.seg.kerf{
 background:#111;
 min-width:8px;
 padding:0;
}
.seg.kerf::after{
 content:"";
 position:absolute;
 top:2px;
 bottom:2px;
 left:50%;
 transform:translateX(-50%);
 border-left:1px dashed #fff;
 opacity:.95;
}

.tailLabel{
 position:absolute;
 right:4px;
 top:50%;
 transform:translateY(-50%);
 z-index:5;
 font-weight:900;
 font-size:12px;
 line-height:1;
 padding:4px 8px;
 border:1px solid var(--line);
 background:rgba(156,163,175,.92);
 color:#111;
 white-space:nowrap;
 pointer-events:none;
}

/* PRINT */
@media print{
 @page{ size:A4; margin:10mm; }
 body{ background:white; color:black; }
 .no-print{ display:none !important; }
 .card{ border:none; padding:0; }
 .logoBox img{ height:34px; }
 .subTitle{ color:#000; }

 .stats{ border:1px solid #000; background:#fff; }
 .stat{ border:1px solid #000; background:#fff; color:#000; }
 .stat b{ color:#000; }
 .stat .v{ color:#000; }

 .bar{ border:1px solid #000; background:#fff; page-break-inside:avoid; }
 .mult{ border:1px solid #000; background:#fff; color:#000; }
 .tailBox{ border:1px solid #000; background:#fff; }
 .tailBox .k,.tailBox .v,.tailBox .v2{ color:#000; }
 .badge{ border:1px solid #000; }

 .viz{ border:1px solid #000; background:#fff; height:28px; }
 .seg{ color:#000 !important; font-size:12px; }
 .seg.cut{ background:#d9d9d9 !important; }
 .seg.rest{ background:#bfbfbf !important; }
 .seg.kerf{ background:#fff !important; min-width:10px; }
 .seg.kerf::after{ border-left:1px dashed #000; }
 .tailLabel{ border:1px solid #000; background:#bfbfbf; color:#000; }
}
</style>
</head>

<body>
<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
 <div class="header">
 <div class="logoBox"><img src="logo.png" alt="Logo"></div>
 <div class="headText">
 <h1>Вход в систему</h1>
 <div class="subTitle">Раскрой профиля</div>
 </div>
 </div>

 <label>Логин</label>
 <input id="loginInput" placeholder="masterclusterpro">

 <label>Пароль</label>
 <input id="passwordInput" type="password" placeholder="qwerty">

 <div class="section no-print" style="display:flex;gap:10px;align-items:center;">
 <button class="primary" id="loginBtn">Войти</button>
 </div>

 <div id="loginMsg" class="err hidden"></div>
</div>

<!-- APP -->
<div id="appBox" class="hidden">
 <div class="card">

 <div class="header">
 <div class="logoBox"><img src="logo.png" alt="Logo"></div>
 <div class="headText" style="min-width:0;">
 <h1>Раскрой профиля</h1>
 <div class="subTitle" id="jobTitleView">—</div>
 </div>
 </div>

 <div class="no-print">
 <label>Название / что режем</label>
 <input id="jobInput" placeholder="Например: Рама 40×40, заказ №12">

 <label>Ширина диска (мм)</label>
 <input id="kerfInput" type="number" value="5" min="0" step="0.1">

 <label>Порог делового хвоста (мм)</label>
 <input id="goodTailMin" type="number" value="200" min="0" step="1">
 </div>

 <div class="section no-print">
 <h3>Профили (порядок как ввёл)</h3>
 <div id="stocksList" class="list"></div>
 <button class="primary" id="addStockBtn">+ Профиль</button>
 </div>

 <div class="section no-print">
 <h3>Заготовки (по очереди строк: 1-я → 2-я → 3-я)</h3>
 <div id="partsList" class="list"></div>
 <button class="primary" id="addPartBtn">+ Заготовка</button>
 </div>

 <div class="section no-print" style="display:flex; gap:10px; flex-wrap:wrap;">
 <button class="primary" id="calcBtn">Рассчитать</button>
 <button class="primary" id="printBtn">Печать / PDF</button>
 <button class="danger" id="logoutBtn">Выйти</button>
 </div>

 <div id="appErr" class="err hidden"></div>
 <div id="stats" class="stats hidden"></div>
 <div id="result" class="bars"></div>

 </div>
</div>

</div>

<script>
/* ===== USERS ===== */
const USERS = { "masterclusterpro":"qwerty", "mastercluster":"qwerty" };

/* ===== DOM ===== */
const el = {
 loginBox: document.getElementById("loginBox"),
 appBox: document.getElementById("appBox"),
 loginInput: document.getElementById("loginInput"),
 passwordInput: document.getElementById("passwordInput"),
 loginBtn: document.getElementById("loginBtn"),
 loginMsg: document.getElementById("loginMsg"),

 jobInput: document.getElementById("jobInput"),
 jobTitleView: document.getElementById("jobTitleView"),

 kerfInput: document.getElementById("kerfInput"),
 goodTailMin: document.getElementById("goodTailMin"),

 stocksList: document.getElementById("stocksList"),
 partsList: document.getElementById("partsList"),

 addStockBtn: document.getElementById("addStockBtn"),
 addPartBtn: document.getElementById("addPartBtn"),

 calcBtn: document.getElementById("calcBtn"),
 printBtn: document.getElementById("printBtn"),
 logoutBtn: document.getElementById("logoutBtn"),

 appErr: document.getElementById("appErr"),
 stats: document.getElementById("stats"),
 result: document.getElementById("result"),
};

/* ===== AUTH ===== */
function showLogin(){ el.appBox.classList.add("hidden"); el.loginBox.classList.remove("hidden"); }
function showApp(){ el.loginBox.classList.add("hidden"); el.appBox.classList.remove("hidden"); syncJobTitle(); }
function doLogin(){
 const l = el.loginInput.value.trim();
 const p = el.passwordInput.value;
 el.loginMsg.classList.add("hidden"); el.loginMsg.textContent = "";
 if(USERS[l] && USERS[l] === p){ localStorage.setItem("authUser", l); showApp(); }
 else { el.loginMsg.textContent="Неверный логин или пароль"; el.loginMsg.classList.remove("hidden"); }
}
function logout(){ localStorage.removeItem("authUser"); location.reload(); }

/* ===== Title ===== */
function syncJobTitle(){
 const t = (el.jobInput.value||"").trim();
 el.jobTitleView.textContent = t || "—";
 document.title = t ? ("Раскрой — " + t) : "Система раскроя профиля";
 localStorage.setItem("jobTitle", t);
}
(function restoreJobTitle(){
 const saved = localStorage.getItem("jobTitle") || "";
 el.jobInput.value = saved;
 el.jobTitleView.textContent = saved.trim() || "—";
})();
el.jobInput.addEventListener("input", syncJobTitle);

/* ===== Helpers ===== */
function fmt(n){
 const r = Math.round(n);
 return (Math.abs(n - r) < 1e-9) ? String(r) : (Math.round(n*100)/100).toString();
}
function sum(arr){ return arr.reduce((s,x)=>s+x,0); }

/* рез после каждой детали */
function kerfTotalForCount(pieceCount, kerf){ return Math.max(0, pieceCount) * kerf; }
function usedLength(pieces, kerf){ return sum(pieces) + kerfTotalForCount(pieces.length, kerf); }
function remainingLen(stockLen, pieces, kerf){ return stockLen - usedLength(pieces, kerf); }
function canAdd(stockLen, pieces, piece, kerf){ return usedLength(pieces.concat([piece]), kerf) <= stockLen; }

/* ===== UI rows ===== */
function removeRow(btn){ btn.closest(".row").remove(); }

function addStockRow(lenVal="3050", qtyVal=""){
 const r = document.createElement("div");
 r.className = "row";
 r.innerHTML = `
 <input class="sLen" type="number" min="1" step="1" placeholder="Длина профиля" value="${lenVal}">
 <input class="sQty inputQty" type="number" min="0" step="1" placeholder="∞" value="${qtyVal}">
 <button class="danger" type="button">−</button>
 `;
 r.querySelector("button").addEventListener("click", e=>removeRow(e.target));
 el.stocksList.appendChild(r);
}

function addPartRow(lenVal="", qtyVal="1"){
 const r = document.createElement("div");
 r.className = "row";
 r.innerHTML = `
 <input class="pLen" type="number" min="1" step="1" placeholder="Длина заготовки" value="${lenVal}">
 <input class="pQty inputQty" type="number" min="1" step="1" value="${qtyVal}">
 <button class="danger" type="button">−</button>
 `;
 r.querySelector("button").addEventListener("click", e=>removeRow(e.target));
 el.partsList.appendChild(r);
}

/* ===== Read inputs ===== */
function readStocksOrdered(){
 const rows = [...el.stocksList.querySelectorAll(".row")];
 const bad = [];
 const ordered = [];
 const seen = new Set();

 rows.forEach((r, idx)=>{
 const lenStr = r.querySelector(".sLen").value.trim();
 if(lenStr === "") return;
 const len = Number(lenStr);
 if(!Number.isFinite(len) || len <= 0){ bad.push(idx+1); return; }
 const L = Math.floor(len);
 if(!seen.has(L)){ seen.add(L); ordered.push(L); }
 });

 if(bad.length) return { ok:false, error:`Ошибка в строках профиля: ${bad.join(", ")}` };
 if(ordered.length === 0) return { ok:false, error:"Добавьте хотя бы одну длину профиля." };
 return { ok:true, stocks: ordered };
}

/* заготовки по строкам (порядок важен!) */
function readPartsByRows(){
 const rows = [...el.partsList.querySelectorAll(".row")];
 const bad = [];
 const items = [];

 rows.forEach((r, idx)=>{
 const lv = r.querySelector(".pLen").value.trim();
 const qv = r.querySelector(".pQty").value.trim();
 if(lv === "" && qv === "") return;

 const len = Number(lv);
 const qty = Number(qv);

 if(!Number.isFinite(len) || len <= 0 || !Number.isFinite(qty) || qty <= 0){
 bad.push(idx+1); return;
 }
 items.push({ len: Math.floor(len), qty: Math.floor(qty) });
 });

 if(bad.length) return { ok:false, error:`Ошибка в строках заготовок: ${bad.join(", ")}` };
 if(items.length === 0) return { ok:false, error:"Добавьте заготовки." };
 return { ok:true, items };
}

/* ===== Output helpers ===== */
function clearOutput(){ el.stats.classList.add("hidden"); el.stats.innerHTML=""; el.result.innerHTML=""; }
function showError(text){ el.appErr.textContent=text; el.appErr.classList.remove("hidden"); }
function hideError(){ el.appErr.textContent=""; el.appErr.classList.add("hidden"); }

/* ===== Stock choose: smallest that fits, but respecting order list (first fit in order) ===== */
function chooseStockLenOrdered(stockLensOrdered, piece){
 for(const L of stockLensOrdered){ if(piece <= L) return L; }
 return null;
}

/* ===== ГЛАВНОЕ: режим "плавный переход только через последнюю палку" =====
 - детали обрабатываются по строкам (1005, потом 1020, потом ...)
 - пока идёт 1005: заполняем ТОЛЬКО палки 1005-группы (и создаём новые)
 - переход на 1020: разрешено докладывать 1020 ТОЛЬКО в последнюю палку предыдущей группы
 - дальше 1020 режется на этой последней палке + на новых палках, но НЕ в старые палки 1005
*/
function packSequentialLastBarTransition(stockLensOrdered, partItems, kerf){
 const bars = []; // {len, pieces:[]}
 let activeStartIndex = 0; // с каких палок можно работать текущей позиции

 // best-fit среди разрешённых палок (activeStartIndex..end)
 function placeInAllowed(piece){
 let bestIdx = -1;
 let bestRem = Infinity;
 for(let i=activeStartIndex; i<bars.length; i++){
 const b = bars[i];
 if(canAdd(b.len, b.pieces, piece, kerf)){
 const rem = remainingLen(b.len, b.pieces.concat([piece]), kerf);
 if(rem < bestRem){ bestRem = rem; bestIdx = i; }
 }
 }
 if(bestIdx >= 0){
 bars[bestIdx].pieces.push(piece);
 return true;
 }
 return false;
 }

 // открыть новую палку (по профилям)
 function openNewBar(piece){
 const L = chooseStockLenOrdered(stockLensOrdered, piece);
 if(L === null) return false;
 bars.push({ len:L, pieces:[piece] });
 return true;
 }

 // обработка каждой строки заготовок
 for(let idx=0; idx<partItems.length; idx++){
 const item = partItems[idx];
 const piece = item.len;
 let remainingQty = item.qty;

 // Режем текущую позицию: используем allowed (activeStartIndex..end) и новые палки
 while(remainingQty > 0){
 if(placeInAllowed(piece)){
 remainingQty--;
 continue;
 }
 if(!openNewBar(piece)){
 return { ok:false, error:`Заготовка ${piece} не помещается ни в одну длину профиля.` };
 }
 remainingQty--;
 }

 // После завершения этой позиции:
 // следующей позиции разрешаем докладываться ТОЛЬКО в последнюю палку текущей позиции
 // => activeStartIndex = lastBarIndex
 activeStartIndex = Math.max(0, bars.length - 1);
 }

 return { ok:true, bars };
}

/* signature for grouping */
function signature(stockLen, pieces){
 return stockLen + "|" + [...pieces].sort((a,b)=>b-a).join(",");
}

/* ===== Calculate ===== */
function calculate(){
 hideError(); clearOutput(); syncJobTitle();

 const kerf = Number(el.kerfInput.value);
 if(!Number.isFinite(kerf) || kerf < 0){ showError("Ошибка: ширина диска должна быть 0 или больше."); return; }

 const goodMin = Number(el.goodTailMin.value);
 if(!Number.isFinite(goodMin) || goodMin < 0){ showError("Ошибка: порог делового хвоста должен быть 0 или больше."); return; }

 const s = readStocksOrdered();
 if(!s.ok){ showError(s.error); return; }

 const pr = readPartsByRows();
 if(!pr.ok){ showError(pr.error); return; }

 const packed = packSequentialLastBarTransition(s.stocks, pr.items, kerf);
 if(!packed.ok){ showError(packed.error); return; }

 const barsAll = packed.bars;

 const totalPiecesCount = pr.items.reduce((acc,x)=>acc + x.qty, 0);
 const totalCutsLen = pr.items.reduce((acc,x)=>acc + x.len * x.qty, 0);

 const totalBars = barsAll.length;
 const totalStockLen = barsAll.reduce((acc,b)=>acc + b.len, 0);

 const totalCutCount = barsAll.reduce((acc, b)=>acc + b.pieces.length, 0);
 const totalKerf = barsAll.reduce((acc, b)=>acc + kerfTotalForCount(b.pieces.length, kerf), 0);

 let totalTailAll=0, tailWaste=0, tailGood=0, tailWasteCount=0, tailGoodCount=0;

 for(const b of barsAll){
 const r = Math.max(0, remainingLen(b.len, b.pieces, kerf));
 totalTailAll += r;
 if(r < goodMin){ tailWaste += r; tailWasteCount++; }
 else { tailGood += r; tailGoodCount++; }
 }

 const totalWasteStrict = totalKerf + tailWaste;
 const eff = totalStockLen > 0 ? (totalCutsLen / totalStockLen * 100) : 0;

 el.stats.classList.remove("hidden");
 el.stats.innerHTML = `
 <div class="stat"><b>Название</b><div class="v">${(el.jobInput.value||"").trim() || "—"}</div></div>
 <div class="stat"><b>Профилей (шт)</b><div class="v">${fmt(totalBars)}</div></div>
 <div class="stat"><b>Деталей (шт)</b><div class="v">${fmt(totalPiecesCount)}</div></div>

 <div class="stat"><b>Сумма деталей (мм)</b><div class="v">${fmt(totalCutsLen)}</div></div>
 <div class="stat"><b>Резов (шт)</b><div class="v">${fmt(totalCutCount)}</div></div>
 <div class="stat"><b>Суммарный рез (мм)</b><div class="v">${fmt(totalKerf)}</div></div>

 <div class="stat"><b>Хвосты всего (мм)</b><div class="v">${fmt(totalTailAll)}</div></div>
 <div class="stat"><b>Деловой хвост (мм)</b><div class="v">${fmt(tailGood)}</div></div>
 <div class="stat"><b>Деловых хвостов (шт)</b><div class="v">${fmt(tailGoodCount)}</div></div>

 <div class="stat"><b>Хвосты в отход (мм)</b><div class="v">${fmt(tailWaste)}</div></div>
 <div class="stat"><b>Хвостов в отход (шт)</b><div class="v">${fmt(tailWasteCount)}</div></div>
 <div class="stat"><b>Отход (рез + хвост&lt;порога)</b><div class="v">${fmt(totalWasteStrict)}</div></div>

 <div class="stat"><b>Общая длина профиля (мм)</b><div class="v">${fmt(totalStockLen)}</div></div>
 <div class="stat"><b>Польза (%)</b><div class="v">${fmt(eff)}%</div></div>
 <div class="stat"><b>Порог делового (мм)</b><div class="v">${fmt(goodMin)}</div></div>
 `;

 /* группировка одинаковых раскладок (для умножения) */
 const groups = new Map();
 for(const b of barsAll){
 const sig = signature(b.len, b.pieces);
 if(!groups.has(sig)) groups.set(sig, { count:1, len:b.len, pieces:[...b.pieces] });
 else groups.get(sig).count++;
 }

 const groupArr = [...groups.values()].sort((a,b)=> b.count-a.count);

 for(const g of groupArr){
 const pieces = [...g.pieces];

 const restPer = Math.max(0, remainingLen(g.len, pieces, kerf));
 const restTotal = restPer * g.count;

 const isGood = restPer >= goodMin;
 const badgeText = isGood ? "Деловой" : "В отход";
 const badgeBg = isGood ? "rgba(34,197,94,.12)" : "rgba(239,68,68,.12)";
 const badgeBorder = isGood ? "1px solid rgba(34,197,94,.6)" : "1px solid rgba(239,68,68,.6)";

 const barEl = document.createElement("div");
 barEl.className = "bar";

 const multEl = document.createElement("div");
 multEl.className = "mult";
 multEl.innerHTML = `${g.count}×<br>${g.len}`;

 const viz = document.createElement("div");
 viz.className = "viz";

 for(const piece of pieces){
 const seg = document.createElement("div");
 seg.className = "seg cut";
 seg.style.width = (piece/g.len*100) + "%";
 seg.textContent = piece;
 viz.appendChild(seg);

 const k = document.createElement("div");
 k.className = "seg kerf";
 k.style.width = Math.max((kerf/g.len*100), 0.8) + "%";
 viz.appendChild(k);
 }

 if(restPer > 0){
 const rs = document.createElement("div");
 rs.className = "seg rest";
 rs.style.width = Math.max(0, (restPer/g.len*100)) + "%";
 rs.textContent = fmt(restPer);
 viz.appendChild(rs);
 }

 const tailLabel = document.createElement("div");
 tailLabel.className = "tailLabel";
 tailLabel.textContent = fmt(restPer);
 viz.appendChild(tailLabel);

 const tailBox = document.createElement("div");
 tailBox.className = "tailBox";
 tailBox.innerHTML =
 `<div class="k">Остаток/Профиль</div><div class="v">${fmt(restPer)}</div>` +
 `<div class="k" style="margin-top:8px;">Остаток всего</div><div class="v2">${fmt(restTotal)}</div>` +
 `<div class="badge" style="background:${badgeBg};border:${badgeBorder};">${badgeText}</div>`;

 barEl.appendChild(multEl);
 barEl.appendChild(viz);
 barEl.appendChild(tailBox);

 el.result.appendChild(barEl);
 }
}

/* ===== Events ===== */
el.loginBtn.addEventListener("click", doLogin);
el.logoutBtn.addEventListener("click", logout);
el.addStockBtn.addEventListener("click", () => addStockRow("", ""));
el.addPartBtn.addEventListener("click", () => addPartRow("", "1"));
el.calcBtn.addEventListener("click", calculate);
el.printBtn.addEventListener("click", () => window.print());

document.addEventListener("keydown", e=>{
 if(e.key !== "Enter") return;
 if(!el.loginBox.classList.contains("hidden")) doLogin();
});

/* ===== Init ===== */
addStockRow("3050", "");
addPartRow("", "1");

if(localStorage.getItem("authUser")) showApp();
else showLogin();
</script>
