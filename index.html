<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Система раскроя профиля</title>

<style>
:root{
  --bg:#0f1115;
  --card:#151922;
  --panel:#0c1020;
  --panel2:#0b0f1c;
  --text:#e7eaf0;
  --muted:#9aa3b2;
  --line:#2a3140;
  --accent:#b71c1c;
}

*{ box-sizing:border-box; border-radius:0 !important; }

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  font-size:15px;
}

.container{ max-width:1100px; margin:auto; padding:20px; }
.card{
  background:var(--card);
  border:1px solid var(--line);
  padding:20px;
}

.hidden{ display:none; }

h1{ margin:0; font-size:20px; }
h3{ margin:0 0 8px; font-size:16px; }

label{ display:block; margin-top:12px; font-weight:700; font-size:13px; }

input,button{
  height:38px;
  border:1px solid var(--line);
  background:#111827;
  color:white;
  padding:0 10px;
  font-size:14px;
}

button{ cursor:pointer; font-weight:800; }
button.primary{ background:#1f2937; }
button.danger{ background:var(--accent); border:none; }

.section{ margin-top:20px; }
.list{ margin-top:10px; display:flex; flex-direction:column; gap:10px; }

.row{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
  align-items:end;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
}

.stats{
  margin-top:20px;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel2);
}

.bars{ margin-top:20px; display:flex; flex-direction:column; gap:15px; }

/* РАСКЛАДКА: слева блок, справа рамка */
.bar{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:15px;
  align-items:center;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
}

/* Левый блок */
.mult{
  border:1px solid var(--line);
  padding:10px;
  text-align:center;
  font-weight:900;
  font-size:14px;
  background:var(--panel2);
  line-height:1.2;
}

/* Визуализация */
.viz{
  display:flex;
  height:30px;
  border:1px solid var(--line);
  background:var(--panel2);
  overflow:hidden;
}

.seg{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:13px;
  overflow:hidden;
  position:relative;
  white-space:nowrap;
  padding:0 6px;
  color:#0b0f1c;
}

.seg.cut{ background:#3b82f6; }
.seg.rest{ background:#9ca3af; color:#111; }
.seg.kerf{
  background:#111;      /* на экране просто тёмная вставка */
  min-width:8px;
  padding:0;
}

/* ОДНА пунктирная линия — только по центру реза */
.seg.kerf::after{
  content:"";
  position:absolute;
  top:2px;
  bottom:2px;
  left:50%;
  transform:translateX(-50%);
  border-left:1px dashed #fff;
  opacity:0.9;
}

/* ===== PRINT A4 ===== */
@media print{
  @page{ size:A4; margin:10mm; }
  body{ background:white; color:black; }
  .no-print{ display:none !important; }
  .card{ border:none; padding:0; }
  input,button{ display:none; } /* печатаем как документ */

  .stats{
    border:1px solid #000;
    background:#fff;
  }
  .stat{
    border:1px solid #000;
    background:#fff;
    color:#000;
  }

  .bar{
    border:1px solid #000;
    background:#fff;
  }
  .mult{
    border:1px solid #000;
    background:#fff;
    color:#000;
  }

  .viz{
    height:28px;
    border:1px solid #000;
    background:#fff;
  }
  .seg{
    font-size:12px;
    color:#000 !important;
  }
  .seg.cut{ background:#d9d9d9 !important; }
  .seg.rest{ background:#f0f0f0 !important; color:#000 !important; }
  .seg.kerf{
    background:#fff !important;
    min-width:10px;
  }
  .seg.kerf::after{
    border-left:1px dashed #000; /* пунктир на печати чёрный */
  }
}
</style>
</head>

<body>
<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <h1>Вход</h1>
  <label>Логин</label>
  <input id="login" placeholder="masterclusterpro"/>
  <label>Пароль</label>
  <input id="password" type="password" placeholder="qwerty"/>
  <button class="primary" style="width:100%;margin-top:12px;" onclick="doLogin()">Войти</button>
  <div id="msg" style="margin-top:10px;color:#ff6666;font-weight:800;"></div>
</div>

<!-- APP -->
<div id="appBox" class="hidden">
<div class="card">

  <h1>Раскрой профиля</h1>

  <div class="no-print">
    <label>Название</label>
    <input id="job" placeholder="Например: заказ №12 / изделие"/>

    <label>Ширина диска (мм)</label>
    <input id="kerf" type="number" value="5" min="0" step="0.1"/>
  </div>

  <div class="section no-print">
    <h3>Профили</h3>
    <div id="stocks" class="list"></div>
    <button class="primary" onclick="addStock()">+ Профиль</button>
  </div>

  <div class="section no-print">
    <h3>Заготовки</h3>
    <div id="parts" class="list"></div>
    <button class="primary" onclick="addPart()">+ Заготовка</button>
  </div>

  <div class="section no-print" style="display:flex;gap:10px;">
    <button class="primary" onclick="calculate()">Рассчитать</button>
    <button onclick="window.print()">Печать / PDF</button>
    <button class="danger" onclick="logout()">Выйти</button>
  </div>

  <div id="stats" class="stats hidden"></div>
  <div id="result" class="bars"></div>

</div>
</div>

</div>

<script>
/* USERS */
const users = {
  "masterclusterpro":"qwerty",
  "mastercluster":"qwerty"
};

function doLogin(){
  const l = document.getElementById("login").value.trim();
  const p = document.getElementById("password").value;
  const msg = document.getElementById("msg");

  if(users[l] && users[l] === p){
    localStorage.setItem("authUser", l);
    showApp();
  }else{
    msg.textContent = "Неверный логин или пароль";
  }
}
function logout(){
  localStorage.removeItem("authUser");
  location.reload();
}
function showApp(){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("appBox").classList.remove("hidden");
}
if(localStorage.getItem("authUser")) showApp();

/* UI */
function addStock(lenVal="6000", qtyVal=""){
  const div = document.createElement("div");
  div.className = "row";
  div.innerHTML = `
    <input class="sLen" type="number" placeholder="Длина" value="${lenVal}">
    <input class="sQty" type="number" placeholder="Кол-во (пусто = ∞)" value="${qtyVal}">
    <button class="danger" onclick="this.parentElement.remove()">−</button>
  `;
  document.getElementById("stocks").appendChild(div);
}
function addPart(lenVal="", qtyVal="1"){
  const div = document.createElement("div");
  div.className = "row";
  div.innerHTML = `
    <input class="pLen" type="number" placeholder="Длина" value="${lenVal}">
    <input class="pQty" type="number" min="1" value="${qtyVal}">
    <button class="danger" onclick="this.parentElement.remove()">−</button>
  `;
  document.getElementById("parts").appendChild(div);
}

addStock("6000","");
addPart("","1");

function fmt(n){
  const r = Math.round(n);
  return (Math.abs(n-r) < 1e-9) ? String(r) : (Math.round(n*100)/100).toString();
}

/* READ INPUTS */
function readStocks(){
  const rows = [...document.querySelectorAll("#stocks .row")];
  const stocks = [];
  for(const r of rows){
    const len = Number(r.querySelector(".sLen").value);
    const qtyStr = r.querySelector(".sQty").value.trim();
    if(!Number.isFinite(len) || len<=0) continue;
    let qty = null;
    if(qtyStr !== ""){
      const q = Number(qtyStr);
      if(Number.isFinite(q) && q>=0) qty = Math.floor(q);
    }
    stocks.push({len:Math.floor(len), qty});
  }
  // merge same lengths
  const m = new Map();
  for(const s of stocks){
    if(!m.has(s.len)) m.set(s.len, {len:s.len, qty:s.qty});
    else{
      const ex = m.get(s.len);
      if(ex.qty===null || s.qty===null) ex.qty=null;
      else ex.qty += s.qty;
    }
  }
  return [...m.values()].sort((a,b)=>a.len-b.len);
}

function readParts(){
  const rows = [...document.querySelectorAll("#parts .row")];
  const parts = [];
  for(const r of rows){
    const len = Number(r.querySelector(".pLen").value);
    const qty = Number(r.querySelector(".pQty").value);
    if(!Number.isFinite(len) || len<=0) continue;
    if(!Number.isFinite(qty) || qty<=0) continue;
    for(let i=0;i<Math.floor(qty);i++) parts.push(Math.floor(len));
  }
  return parts;
}

/* PACKING (простое: кладём в одну палку, как в твоём минимальном варианте) */
function calculate(){
  const kerf = Math.max(0, Number(document.getElementById("kerf").value)||0);
  const stocks = readStocks();
  const parts = readParts();

  const statsEl = document.getElementById("stats");
  const resEl = document.getElementById("result");
  statsEl.innerHTML = "";
  resEl.innerHTML = "";

  if(stocks.length===0 || parts.length===0) return;

  // берём первую длину профиля
  const stock = stocks[0].len;

  parts.sort((a,b)=>b-a);

  let sumCuts = 0;
  let cutsCount = 0;
  const used = [];

  for(const p of parts){
    const addKerf = (cutsCount>0) ? kerf : 0;
    if(sumCuts + addKerf + p <= stock){
      sumCuts += addKerf + p;
      used.push(p);
      cutsCount++;
    }
  }

  const rest = stock - sumCuts;
  const kerfTotal = Math.max(0, used.length-1) * kerf;

  statsEl.classList.remove("hidden");
  statsEl.innerHTML = `
    <div class="stat"><b>Профиль</b><br>${stock}</div>
    <div class="stat"><b>Сумма деталей</b><br>${used.reduce((s,x)=>s+x,0)}</div>
    <div class="stat"><b>Суммарный рез</b><br>${fmt(kerfTotal)}</div>
    <div class="stat"><b>Остаток</b><br>${fmt(rest)}</div>
    <div class="stat"><b>Заготовок</b><br>${used.length}</div>
    <div class="stat"><b>Название</b><br>${(document.getElementById("job").value||"Без названия")}</div>
  `;

  // visualization
  const viz = document.createElement("div");
  viz.className = "viz";

  used.forEach((p,i)=>{
    const seg = document.createElement("div");
    seg.className = "seg cut";
    seg.style.width = (p/stock*100) + "%";
    seg.textContent = p;
    viz.appendChild(seg);

    if(i < used.length-1 && kerf>0){
      const k = document.createElement("div");
      k.className = "seg kerf";
      k.style.width = Math.max((kerf/stock*100), 0.8) + "%";
      viz.appendChild(k);
    }
  });

  const rs = document.createElement("div");
  rs.className = "seg rest";
  rs.style.width = Math.max(0,(rest/stock*100)) + "%";
  rs.textContent = fmt(rest);
  viz.appendChild(rs);

  // bar row (левый блок + рамка)
  const bar = document.createElement("div");
  bar.className = "bar";

  const mult = document.createElement("div");
  mult.className = "mult";
  mult.innerHTML = `1×<br>${stock}`;

  bar.appendChild(mult);
  bar.appendChild(viz);

  resEl.appendChild(bar);
}
</script>
</body>
</html>
