<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Система раскроя профиля</title>

<style>
:root{
  --bg:#0f1115;
  --card:#151922;
  --panel:#0c1020;
  --panel2:#0b0f1c;
  --text:#e7eaf0;
  --line:#2a3140;
  --accent:#b71c1c;
  --bad:#ff6666;
}
*{ box-sizing:border-box; border-radius:0 !important; }

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
}

.container{ max-width:1200px; margin:auto; padding:20px; }
.card{ background:var(--card); border:1px solid var(--line); padding:20px; }

.hidden{ display:none; }

h1{ margin:0 0 15px; }

input,button{
  height:36px;
  border:1px solid var(--line);
  background:#111827;
  color:white;
  padding:0 10px;
}
button{ cursor:pointer; font-weight:700; }
button.primary{ background:#1f2937; }
button.danger{ background:var(--accent); border:none; }

.section{ margin-top:20px; }
.list{ margin-top:10px; display:flex; flex-direction:column; gap:10px; }

.row{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
}

.err{
  margin-top:12px;
  padding:10px;
  border:1px solid var(--accent);
  color:var(--bad);
  background:rgba(183,28,28,.12);
  font-weight:800;
}

.stats{
  margin-top:20px;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel2);
}

.bars{ margin-top:20px; display:flex; flex-direction:column; gap:15px; }

.bar{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:15px;
  border:1px solid var(--line);
  padding:10px;
  background:var(--panel);
}

.mult{
  border:1px solid var(--line);
  padding:10px;
  text-align:center;
  font-weight:900;
  background:var(--panel2);
}

.viz{
  display:flex;
  height:30px;
  border:1px solid var(--line);
  background:var(--panel2);
  overflow:hidden;
}

.seg{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:13px;
  overflow:hidden;
  min-width:0;
  white-space:nowrap;
  padding:0 6px;
  position:relative;
}
.seg span{
  display:block;
  max-width:100%;
  overflow:hidden;
}

.seg.cut{ background:#3b82f6; color:#000; }
.seg.rest{ background:#9ca3af; color:#000; }

.seg.kerf{
  background:#111;
  min-width:8px;
}
.seg.kerf::after{
  content:"";
  position:absolute;
  top:2px;
  bottom:2px;
  left:50%;
  transform:translateX(-50%);
  border-left:1px dashed #fff;
}
</style>
</head>

<body>
<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <h1>Вход</h1>
  <input id="login" placeholder="Логин"><br><br>
  <input id="password" type="password" placeholder="Пароль"><br><br>
  <button class="primary" onclick="doLogin()">Войти</button>
  <div id="msg" class="err hidden"></div>
</div>

<!-- APP -->
<div id="appBox" class="hidden">
<div class="card">

<h1>Раскрой профиля</h1>

<label>Название</label>
<input id="job">

<label>Ширина диска (мм)</label>
<input id="kerf" type="number" value="5">

<div class="section">
<h3>Профили</h3>
<div id="stocks" class="list"></div>
<button class="primary" onclick="addStock()">+ Профиль</button>
</div>

<div class="section">
<h3>Заготовки</h3>
<div id="parts" class="list"></div>
<button class="primary" onclick="addPart()">+ Заготовка</button>
</div>

<div class="section">
<button class="primary" onclick="calculate()">Рассчитать</button>
<button class="danger" onclick="logout()">Выйти</button>
</div>

<div id="appErr" class="err hidden"></div>
<div id="stats" class="stats hidden"></div>
<div id="result" class="bars"></div>

</div>
</div>
</div>

<script>
const users={
  "masterclusterpro":"qwerty",
  "mastercluster":"qwerty"
};

function doLogin(){
  const l=login.value.trim();
  const p=password.value;
  if(users[l] && users[l]===p){
    localStorage.setItem("auth",l);
    loginBox.classList.add("hidden");
    appBox.classList.remove("hidden");
  }else{
    msg.textContent="Неверный логин или пароль";
    msg.classList.remove("hidden");
  }
}
function logout(){ localStorage.removeItem("auth"); location.reload(); }
if(localStorage.getItem("auth")){
  loginBox.classList.add("hidden");
  appBox.classList.remove("hidden");
}

function addStock(val="6000"){
  const r=document.createElement("div");
  r.className="row";
  r.innerHTML=`<input class="sLen" value="${val}">
               <div></div>
               <button onclick="this.parentElement.remove();calculate()">−</button>`;
  stocks.appendChild(r);
}
function addPart(val="",qty="1"){
  const r=document.createElement("div");
  r.className="row";
  r.innerHTML=`<input class="pLen" value="${val}">
               <input class="pQty" value="${qty}">
               <button onclick="this.parentElement.remove();calculate()">−</button>`;
  parts.appendChild(r);
}
addStock();
addPart();

function fmt(n){ return Math.round(n*100)/100; }

function calculate(){
  appErr.classList.add("hidden");
  stats.classList.add("hidden");
  result.innerHTML="";

  const kerf=parseFloat(document.getElementById("kerf").value)||0;

  const stock=parseInt(document.querySelector(".sLen").value);
  if(!stock){ appErr.textContent="Введите длину профиля"; appErr.classList.remove("hidden"); return; }

  let partsList=[];
  document.querySelectorAll(".pLen").forEach((el,i)=>{
    const len=parseInt(el.value);
    const qty=parseInt(document.querySelectorAll(".pQty")[i].value)||1;
    if(len){
      for(let j=0;j<qty;j++) partsList.push(len);
    }
  });
  if(partsList.length===0){
    appErr.textContent="Добавьте заготовки";
    appErr.classList.remove("hidden");
    return;
  }

  partsList.sort((a,b)=>b-a);

  const bars=[];

  for(const piece of partsList){
    let placed=false;

    for(const bar of bars){
      const addKerf=bar.parts.length>0?kerf:0;
      if(bar.sum+addKerf+piece<=stock){
        bar.parts.push(piece);
        bar.sum+=addKerf+piece;
        placed=true;
        break;
      }
    }

    if(!placed){
      bars.push({parts:[piece],sum:piece});
    }
  }

  // группировка
  const groups={};
  bars.forEach(bar=>{
    const key=bar.parts.slice().sort((a,b)=>b-a).join(",");
    if(!groups[key]) groups[key]={count:0,layout:bar.parts};
    groups[key].count++;
  });

  stats.classList.remove("hidden");
  stats.innerHTML=`
    <div class="stat"><b>Палок</b><br>${bars.length}</div>
    <div class="stat"><b>Профиль</b><br>${stock}</div>
    <div class="stat"><b>Деталей</b><br>${partsList.length}</div>
  `;

  Object.values(groups).forEach(g=>{
    const barDiv=document.createElement("div");
    barDiv.className="bar";

    const mult=document.createElement("div");
    mult.className="mult";
    mult.innerHTML=`${g.count}×<br>${stock}`;

    const viz=document.createElement("div");
    viz.className="viz";

    let usedSum=0;
    g.layout.forEach((p,i)=>{
      const seg=document.createElement("div");
      seg.className="seg cut";
      seg.style.width=(p/stock*100)+"%";
      seg.innerHTML=`<span>${p}</span>`;
      viz.appendChild(seg);

      if(i<g.layout.length-1){
        const k=document.createElement("div");
        k.className="seg kerf";
        k.style.width=Math.max((kerf/stock*100),0.8)+"%";
        viz.appendChild(k);
      }
      usedSum+=p;
      if(i>0) usedSum+=kerf;
    });

    const rest=stock-usedSum;
    if(rest>0){
      const border=document.createElement("div");
      border.className="seg kerf";
      border.style.width="0.8%";
      viz.appendChild(border);

      const rs=document.createElement("div");
      rs.className="seg rest";
      rs.style.width=(rest/stock*100)+"%";
      rs.innerHTML=`<span>${fmt(rest)}</span>`;
      viz.appendChild(rs);
    }

    barDiv.appendChild(mult);
    barDiv.appendChild(viz);
    result.appendChild(barDiv);
  });
}
</script>
</body>
</html>
