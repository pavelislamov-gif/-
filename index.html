<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Система раскроя профиля</title>

<style>
:root{
  --bg:#0f1115;
  --card:#151922;
  --text:#e7eaf0;
  --muted:#9aa3b2;
  --accent:#b71c1c;
  --ok:#22c55e;
  --bad:#ef4444;
  --line:#2a3140;
}

*{ box-sizing:border-box; }

body{
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.container{
  max-width:1000px;
  margin:0 auto;
  padding:20px;
}

.card{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  border:1px solid var(--line);
  box-shadow:0 15px 35px rgba(0,0,0,.35);
}

/* ================= HEADER ================= */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}

.logoBox{
  height:46px;
  display:flex;
  align-items:center;
}

.logoBox img{
  height:46px;
  width:auto;
  display:block;
}

.brand h1{
  margin:0;
  font-size:20px;
}

.brand .sub{
  font-size:13px;
  color:var(--muted);
}

/* ================= FORMS ================= */

label{
  font-weight:600;
  font-size:14px;
  margin:10px 0 6px;
  display:block;
}

input{
  width:100%;
  padding:10px 12px;
  font-size:15px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#0e1220;
  color:var(--text);
}

button{
  padding:10px 14px;
  font-size:14px;
  font-weight:700;
  border-radius:10px;
  border:1px solid var(--line);
  background:#1e2533;
  color:var(--text);
  cursor:pointer;
}

button.primary{ background:#2b3447; }
button.danger{ background:var(--accent); border:none; }
button.ghost{ background:transparent; }

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

/* маленькое поле ширины диска */
.inlineField{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.inputTiny{
  width:110px;
  padding:6px 10px;
  font-size:15px;
}

/* ================= PARTS ================= */

.partsHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:20px;
}

.partsList{
  margin-top:14px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.partRow{
  display:grid;
  grid-template-columns:1.2fr 0.8fr 0.6fr;
  gap:12px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0c1020;
}

/* Убираем двойные рамки */
.partRow input{
  border:1px solid transparent;
  background:rgba(255,255,255,0.05);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08);
}

.partRow input:focus{
  outline:none;
  box-shadow:inset 0 0 0 1px #60a5fa;
}

.partRow button{
  height:40px;
}

/* ================= RESULT ================= */

.result{
  margin-top:25px;
}

.resultGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:15px;
}

.stat{
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#0c1020;
}

.stat .k{
  font-size:12px;
  color:var(--muted);
}

.stat .v{
  font-size:18px;
  font-weight:800;
  margin-top:4px;
}

.bars{
  margin-top:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.barCard{
  padding:14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#0c1020;
}

.barLine{
  display:grid;
  grid-template-columns:70px 1fr;
  gap:10px;
  align-items:center;
}

.mult{
  text-align:center;
  padding:8px;
  border-radius:10px;
  border:1px solid var(--line);
  font-weight:800;
}

/* визуализация */
.viz{
  height:30px;
  display:flex;
  overflow:hidden;
  border-radius:8px;
  border:1px solid var(--line);
}

.seg{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:700;
}

.seg.cut{ background:#60a5fa; }
.seg.kerf{
  background:#ff0000;
  min-width:6px;
}
.seg.rest{
  background:#9ca3af;
  color:#111;
}

.hidden{ display:none; }

/* ================= PRINT ================= */

@media print{
  @page{ size:A4; margin:10mm; }
  body{ background:white; color:black; }
  .no-print{ display:none !important; }
  .card{ border:none; box-shadow:none; }
  .viz{ height:18px; }
  .seg{ font-size:8px; }
  .logoBox img{ height:28px; }
}

</style>
</head>

<body>
<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <div class="brand">
    <div class="logoBox">
      <img src="logo.png" alt="Logo">
    </div>
    <div>
      <h1>CLUSTER X</h1>
      <div class="sub">Вход в систему раскроя профиля</div>
    </div>
  </div>

  <label>Логин</label>
  <input id="login" type="text">

  <label>Пароль</label>
  <input id="password" type="password">

  <button class="primary" onclick="doLogin()">Войти</button>
  <div id="loginMsg"></div>
</div>

<!-- APP -->
<div id="appBox" class="hidden">
<div class="card">

<div class="topbar no-print">
  <div class="brand">
    <div class="logoBox">
      <img src="logo.png" alt="Logo">
    </div>
    <div>
      <h1>Раскрой алюминиевого профиля</h1>
      <div class="sub">Группировка одинаковых раскладок (2× + одна визуализация)</div>
    </div>
  </div>
  <button class="danger" onclick="logout()">Выйти</button>
</div>

<div class="row no-print">
  <div>
    <label>Длина профиля</label>
    <input id="stockLen" type="number" value="6000">
  </div>

  <div>
    <label>Ширина диска (рез), мм</label>
    <div class="inlineField">
      <input id="cutWidth" class="inputTiny" type="number" value="5">
      <div style="font-size:12px;color:var(--muted);">
        Рез = (k−1)×ширина
      </div>
    </div>
  </div>
</div>

<div class="partsHead no-print">
  <div>
    <label style="margin:0;">Заготовки</label>
  </div>
  <button class="primary" onclick="addPartRow()">+ Добавить</button>
</div>

<div id="partsList" class="partsList no-print"></div>

<div class="row no-print" style="margin-top:14px;">
  <button class="primary" onclick="calculate()">Рассчитать</button>
  <button class="ghost" onclick="window.print()">Печать / PDF</button>
</div>

<div id="result" class="result"></div>

</div>
</div>

</div>

<script>
const users = {
  "masterclusterpro":"qwerty",
  "mastercluster":"qwerty"
};

function doLogin(){
  const l=document.getElementById("login").value.trim();
  const p=document.getElementById("password").value;
  if(users[l] && users[l]===p){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("appBox").classList.remove("hidden");
  }else{
    document.getElementById("loginMsg").innerHTML="<div style='color:red'>Ошибка входа</div>";
  }
}

function logout(){ location.reload(); }

const partsList=document.getElementById("partsList");

function addPartRow(){
  const row=document.createElement("div");
  row.className="partRow";
  row.innerHTML=`
    <div>
      <small>Длина</small>
      <input class="pLen" type="number">
    </div>
    <div>
      <small>Количество</small>
      <input class="pQty" type="number" value="1">
    </div>
    <div>
      <small>&nbsp;</small>
      <button class="danger" onclick="this.closest('.partRow').remove()">Удалить</button>
    </div>
  `;
  partsList.appendChild(row);
}

addPartRow();

function calculate(){
  const stockLen=Number(document.getElementById("stockLen").value);
  const cutWidth=Number(document.getElementById("cutWidth").value);

  const rows=[...document.querySelectorAll(".partRow")];
  let cuts=[];
  rows.forEach(r=>{
    const len=Number(r.querySelector(".pLen").value);
    const qty=Number(r.querySelector(".pQty").value);
    if(len>0 && qty>0){
      for(let i=0;i<qty;i++) cuts.push(len);
    }
  });

  cuts.sort((a,b)=>b-a);
  let bars=[];

  for(const piece of cuts){
    let placed=false;
    for(const bar of bars){
      const k=bar.length+1;
      const sum=bar.reduce((s,x)=>s+x,0)+piece;
      const kerf=(k-1)*cutWidth;
      if(sum+kerf<=stockLen){
        bar.push(piece);
        placed=true;
        break;
      }
    }
    if(!placed) bars.push([piece]);
  }

  renderResult(stockLen,cutWidth,bars);
}

function renderResult(stockLen,cutWidth,bars){
  const result=document.getElementById("result");
  result.innerHTML="";

  const totalStock=bars.length*stockLen;

  let totalWaste=0;

  const groups={};

  bars.forEach(b=>{
    const key=b.slice().sort((a,b)=>b-a).join(",");
    if(!groups[key]) groups[key]={count:0,pieces:b};
    groups[key].count++;

    const sum=b.reduce((s,x)=>s+x,0);
    const waste=stockLen-(sum+(b.length-1)*cutWidth);
    totalWaste+=waste;
  });

  result.innerHTML+=`
    <div style="font-weight:800;margin-bottom:10px;">
      Нужно профилей: ${bars.length} | Общая длина: ${totalStock} | Отход: ${Math.round(totalWaste)}
    </div>
  `;

  Object.values(groups).forEach(g=>{
    const card=document.createElement("div");
    card.className="barCard";

    const line=document.createElement("div");
    line.className="barLine";

    const mult=document.createElement("div");
    mult.className="mult";
    mult.textContent=g.count+"×";

    const viz=document.createElement("div");
    viz.className="viz";

    const pieces=g.pieces.slice().sort((a,b)=>b-a);

    pieces.forEach((p,i)=>{
      const seg=document.createElement("div");
      seg.className="seg cut";
      seg.style.width=(p/stockLen*100)+"%";
      seg.textContent=p;
      viz.appendChild(seg);

      if(i!==pieces.length-1){
        const k=document.createElement("div");
        k.className="seg kerf";
        let percent=(cutWidth/stockLen*100);
        k.style.width=Math.max(percent,0.8)+"%";
        viz.appendChild(k);
      }
    });

    const sum=pieces.reduce((s,x)=>s+x,0);
    const waste=stockLen-(sum+(pieces.length-1)*cutWidth);
    const rest=document.createElement("div");
    rest.className="seg rest";
    rest.style.width=(waste/stockLen*100)+"%";
    rest.textContent=Math.round(waste);
    viz.appendChild(rest);

    line.appendChild(mult);
    line.appendChild(viz);

    card.appendChild(line);
    result.appendChild(card);
  });
}
</script>
</body>
</html>
